<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thoughts</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/xterm.css">
  <link rel="stylesheet" href="/static/client.css">
  <script defer src="/static/xterm.js"></script>
  <script defer src="/static/addon-fit.js"></script>
  <script defer src="/static/addon-unicode-graphemes.js"></script>
  <script defer src="/static/microphone.js"></script>
  <script defer src="/static/pcm-capture.js"></script>
  <script defer src="/static/appearance.js"></script>
  <script defer src="/static/client.js"></script>
</head>
<body>
  <img id="background-image" alt="" aria-hidden="true" hidden>
  <div id="background-overlay" aria-hidden="true" hidden></div>
  <header><strong>Thoughts</strong><span id="status" role="status">Connecting…</span><button id="reconnect" hidden>Reconnect</button></header>
  <main id="terminal" aria-label="Thoughts terminal"></main>
  <dialog id="appearance-dialog" aria-labelledby="appearance-title">
    <div class="options-content">
    <h2 id="appearance-title">Options</h2>
    <h3>Appearance</h3>
    <p>Browser background only. Your terminal session stays open. Ctrl+, opens Options from any screen.</p>
    <label for="background-file">Background image</label>
    <input id="background-file" type="file" accept="image/jpeg,image/png">
    <p class="appearance-hint">JPEG or PNG · up to 16 MiB · 8,192 pixels per side · 24 million pixels</p>
    <div id="background-preview-wrap" hidden><img id="background-preview" alt="Selected background preview" hidden></div>
    <label for="background-darkness">Background darkness <output id="darkness-value">70%</output></label>
    <input id="background-darkness" type="range" min="0" max="95" value="70">
    <p id="appearance-status" role="status"></p>
    <div class="appearance-actions">
      <button id="appearance-apply" type="button">Apply</button>
      <button id="appearance-remove" type="button">Remove background</button>
      <button id="appearance-close" type="button">Back to terminal</button>
    </div>
    </div>
  </dialog>
</body>
</html>

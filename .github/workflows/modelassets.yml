name: Local model assets and speech

on:
  pull_request:
    paths:
      - 'internal/modelassets/**'
      - 'internal/speech/**'
      - 'cmd/moonshine-smoke/**'
      - 'cmd/thoughts-tui/**'
      - 'scripts/setup-moonshine-windows.ps1'
      - 'scripts/moonshine-dev.sh'
      - 'scripts/moonshine_dev_test.go'
      - 'scripts/package-browser.sh'
      - 'Makefile'
      - 'docs/moonshine.md'
      - 'docs/desktop-bundle.md'
      - 'docs/platform-support.md'
      - 'AGENTS.md'
      - '.github/workflows/modelassets.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  package:
    name: Portable packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -v ./internal/modelassets ./internal/speech/... ./cmd/moonshine-smoke ./cmd/thoughts-tui ./scripts
      - name: Normal builds without cgo or Moonshine
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          go test -count=1 ./internal/speech/... ./cmd/moonshine-smoke ./cmd/thoughts-tui
          go test -tags=moonshine -count=1 ./internal/speech/... ./cmd/moonshine-smoke ./cmd/thoughts-tui
          go build ./...

      - name: iOS keeps the unavailable runtime boundary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$(GOOS=ios GOARCH=arm64 CGO_ENABLED=1 go list -tags=moonshine -f '{{len .CgoFiles}}' ./internal/speech/moonshine)" = 0
          test "$(GOOS=ios GOARCH=arm64 CGO_ENABLED=1 go list -tags=moonshine -f '{{range .GoFiles}}{{if eq . "native_unavailable.go"}}unavailable{{end}}{{end}}' ./internal/speech/moonshine)" = unavailable

  native:
    name: Native transcription (${{ matrix.goos }}/${{ matrix.goarch }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            runner_arch: X64
            archive: moonshine-voice-linux-x86_64.tar.gz
          - os: macos-15
            goos: darwin
            goarch: arm64
            runner_arch: ARM64
            archive: Moonshine.xcframework.zip
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            runner_arch: X64
            archive: Moonshine.xcframework.zip
          - os: windows-2022
            goos: windows
            goarch: amd64
            runner_arch: X64
            archive: moonshine-voice-windows-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Assert native target and record runtime identity
        shell: bash
        run: |
          test "$(go env GOOS)" = '${{ matrix.goos }}'
          test "$(go env GOARCH)" = '${{ matrix.goarch }}'
          test '${{ runner.arch }}' = '${{ matrix.runner_arch }}'
          echo 'GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} runner_arch=${{ runner.arch }}'
          echo 'Moonshine Voice v0.1.5 archive=${{ matrix.archive }}'
      - name: Prepare pinned native runtime through developer setup
        shell: bash
        run: make speech/setup
      - name: Configure integration model directory
        shell: bash
        run: echo "THOUGHTS_MODELS_DIR=$RUNNER_TEMP/moonshine-models" >> "$GITHUB_ENV"
      - name: Explicitly install approved model through modelassets
        run: go run ./cmd/moonshine-smoke install -models-dir "$THOUGHTS_MODELS_DIR"
        shell: bash
      - name: Build a speech-enabled app bundle
        shell: bash
        run: make tui/package
      - name: Execute native integration from the relocated bundle
        shell: bash
        run: |
          bundleName='thoughts-${{ matrix.goos }}-${{ matrix.goarch }}'
          testExecutable=moonshine-native.test
          if [ '${{ matrix.goos }}' = windows ]; then testExecutable="$testExecutable.exe"; fi
          relocatedDirectory=$(mktemp -d)
          trap 'rm -rf "$relocatedDirectory"' EXIT
          bash scripts/moonshine-dev.sh exec go test -c '-tags=moonshine,moonshine_integration' -race -o "$relocatedDirectory/$testExecutable" ./internal/speech/moonshine
          if [ '${{ matrix.goos }}' = windows ]; then
            export THOUGHTS_PACKAGE_ARCHIVE
            THOUGHTS_PACKAGE_ARCHIVE=$(cygpath -m "$PWD/bin/packages/$bundleName.zip")
            export THOUGHTS_PACKAGE_EXTRACT
            THOUGHTS_PACKAGE_EXTRACT=$(cygpath -m "$relocatedDirectory")
            pwsh -NoProfile -Command 'Expand-Archive -LiteralPath $env:THOUGHTS_PACKAGE_ARCHIVE -DestinationPath $env:THOUGHTS_PACKAGE_EXTRACT'
            appExecutable=thoughts-tui.exe
          else
            tar -xzf "bin/packages/$bundleName.tar.gz" -C "$relocatedDirectory"
            appExecutable=thoughts-tui
          fi
          mv "$relocatedDirectory/$testExecutable" "$relocatedDirectory/$bundleName/$testExecutable"
          unset LD_LIBRARY_PATH DYLD_LIBRARY_PATH
          "$relocatedDirectory/$bundleName/$appExecutable" --help > /dev/null
          cd internal/speech/moonshine
          "$relocatedDirectory/$bundleName/$testExecutable" -test.v -test.timeout=10m
      - name: Retain the candidate app release artifact
        uses: actions/upload-artifact@v4
        with:
          name: thoughts-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bin/packages/thoughts-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz*
            bin/packages/thoughts-${{ matrix.goos }}-${{ matrix.goarch }}.zip*
          if-no-files-found: error
      - name: Record executed integration target
        shell: bash
        run: echo 'Native transcription executed successfully on ${{ matrix.goos }}/${{ matrix.goarch }} (${{ runner.arch }}) using ${{ matrix.archive }}' >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: Complete repository checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make ci

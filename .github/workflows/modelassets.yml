name: Model assets

on:
  push:
    branches: [feature/modelassets]
  pull_request:
    paths:
      - 'internal/modelassets/**'
      - '.github/workflows/modelassets.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -v ./internal/modelassets

  ci:
    name: Complete repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make ci
